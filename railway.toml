# ============================================================================
# LOSBETO — railway.toml (v47.0.3-SYNC)
#
# A MUDANÇA DESTA VERSÃO: --worker-class sync --workers 4 --timeout 45
#
# Por quê: com gthread (2 workers × 8 threads), uma thread travada numa fonte
# externa/DNS NUNCA era reciclada — o worker seguia mandando heartbeat e o
# gunicorn nunca o reiniciava. 16 threads travadas = nó morto até restart
# manual ("Application failed to respond"). Com sync, cada worker atende UMA
# requisição: se ela passar de 45s, o master MATA o worker e forja outro na
# hora (--preload = fork instantâneo). Travamento permanente deixa de existir.
#
# Se o seu railway.toml atual tiver outras seções/linhas ([build] etc.),
# MANTENHA-as — a única linha que precisa mudar é a startCommand.
# ============================================================================

[deploy]
startCommand = "gunicorn --worker-class sync --workers 4 --preload --timeout 45 --graceful-timeout 20 --keep-alive 30 --max-requests 5000 --max-requests-jitter 500 --bind 0.0.0.0:$PORT nexus_omega:app"
healthcheckPath = "/ready"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Notas:
# - --timeout 45: sobra para os endpoints de IA mais longos (~20-30s); o socket
#   interno desiste em 25s (setdefaulttimeout no código), então a requisição
#   falha graciosamente ANTES do worker ser morto.
# - --max-requests 5000: recicla workers periodicamente (proteção anti-vazamento).
# - Memória: 4 workers compartilham a maior parte da RAM via fork+preload.
#   Se a aba Metrics mostrar folga, pode subir para --workers 6.
