# ============================================================================
# LOSBETO — railway.toml
#
# v48.3.2 — CORREÇÃO DO CRASH LOOP "'$PORT' is not a valid port number":
# o startCommand antigo usava $PORT. Com builder NIXPACKS o Railway executa o
# startCommand VIA SHELL (expande $PORT — por isso funcionou por meses); com
# Dockerfile ele executa SEM shell, e o gunicorn recebia o texto literal
# '$PORT'. O startCommand tem PRIORIDADE sobre o CMD do Dockerfile — era ele
# que derrubava o deploy, não o Dockerfile.
#
# A correção: o comando de arranque é a string fixa "sh /app/start.sh" — sem
# variável nenhuma para o launcher expandir. A expansão de ${PORT:-8080}
# acontece DENTRO do script, pelo sh, com certeza. O mesmo start.sh é o CMD
# do Dockerfile: um só caminho de arranque, impossível divergir.
#
# [build] builder = NIXPACKS continua como FALLBACK: com o Dockerfile presente
# o Railway usa o Dockerfile; se um dia o Dockerfile for removido (rollback),
# o nixpacks.toml assume de novo — e o startCommand abaixo serve aos dois
# mundos, porque o start.sh existe na imagem das duas formas de build
# (no nixpacks, ele é copiado com o resto do repo para /app).
# ============================================================================

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "sh /app/start.sh"
healthcheckPath = "/ready"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Notas:
# - --timeout 45 (dentro do start.sh): sobra para os endpoints de IA mais
#   longos (~20-30s); o socket interno desiste em 25s (setdefaulttimeout no
#   código), então a requisição falha graciosamente ANTES do worker ser morto.
# - --max-requests 5000: recicla workers periodicamente (anti-vazamento).
# - Memória: 4 workers compartilham a maior parte da RAM via fork+preload.
#   Se a aba Metrics mostrar folga, pode subir para --workers 6 no start.sh.
# - Se existir um "Custom Start Command" na UI do Railway (Settings → Deploy),
#   ele tem prioridade sobre TUDO — deixe aquele campo VAZIO.
